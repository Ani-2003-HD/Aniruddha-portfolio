name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GITHUB_TOKEN is read-only by default. peaceiris deploys by pushing a
# commit to the gh-pages branch, which needs write access to contents.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this type-checks and
      # bundles in one step. There is no test step because the project has
      # no test suite — the old one ran `npm test`, which exits 1 when no
      # test script exists and failed every run.
      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Vite outputs to dist/. The old workflow published ./build, the
          # Create React App directory this project stopped producing.
          publish_dir: ./dist
